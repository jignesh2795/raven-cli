[workspace]
resolver = "2"
members = [
    "crates/raven-core",
    "crates/raven-provider",
    "crates/raven-tools",
    "crates/raven-store",
    "crates/raven-sandbox",
    "crates/raven-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
authors = ["Raven CLI contributors"]
repository = "https://example.invalid/raven-cli"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
dunce = "1"
eventsource-stream = "0.2"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
ignore = "0.4"
keyring = { version = "3", features = ["windows-native"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
